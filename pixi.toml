[workspace]
name = "pypsa-evaluations"
version = "0.1.0"
description = "PyPSA network evaluations for Austria and beyond"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.10,<3.13"
pypsa = ">=1.0"
geopandas = ">=0.14"
matplotlib = ">=3.7"
cartopy = ">=0.22"
shapely = ">=2.0"
pandas = ">=2.0"
numpy = ">=1.24"
xarray = ">=2023.1"
pillow = ">=9.0"
ffmpeg = ">=8.0.1,<9"
